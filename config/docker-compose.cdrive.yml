# Windows Docker Desktop 的 D: virtiofs 损坏时用（mkdir /run/desktop/mnt/host/d: file exists）。
# 先在宿主机建 NTFS 目录联接（不需要管理员）：
#   cmd /c mklink /J C:\Users\蒋蒋\artex-bind D:\ARTEX渗透\ARTEX
#   cmd /c mklink /J C:\Users\蒋蒋\erka-bind D:\二开artex
# virtiofs 只挂 C:，联接在 Windows 侧解析，容器看到的是真实文件。
#
# 启动（项目名必须是 artex，沿用已有 postgres 卷；不要叠原 docker-compose.yml，那份含 D: 绑定）：
#   docker compose -p artex --env-file D:\ARTEX渗透\ARTEX\.env -f D:\二开artex\config\docker-compose.cdrive.yml up -d
#
# 不要把本文件复制成 ARTEX/docker-compose.override.yml。
# 不要整卷 overlay /app/skills。pos-* 按目录叠在 skills 之上。
# 本 workaround 不挂滴滴/字节 D: 工作区。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: mianhuatang11/artex:${ARTEX_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      GROK_BRIDGE_HOST: "127.0.0.1"
      GROK_BRIDGE_PORT: "8790"
      GROK_AUTH_JSON: /auth.json
      GROK_BRIDGE_LOG: /app/data/grok-bridge.log
      PYTHONUNBUFFERED: "1"
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ${ARTEX_BIND:-C:/Users/蒋蒋/artex-bind}/data:/app/data
      - ${ARTEX_BIND:-C:/Users/蒋蒋/artex-bind}/skills:/app/skills
      - ${ARTEX_BIND:-C:/Users/蒋蒋/artex-bind}/grok-bridge.py:/app/grok-bridge.py:ro
      - C:/Users/蒋蒋/.grok/auth.json:/auth.json
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-pentest:/app/skills/pos-pentest:ro
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-usb-entry:/app/skills/pos-usb-entry:ro
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-pax-fastboot:/app/skills/pos-pax-fastboot:ro
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-verifone-sbi:/app/skills/pos-verifone-sbi:ro
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-mtk-brom:/app/skills/pos-mtk-brom:ro
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-android-lpe:/app/skills/pos-android-lpe:ro
      - ${ERKA_BIND:-C:/Users/蒋蒋/erka-bind}/skills/pos-takeover:/app/skills/pos-takeover:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python -u /app/grok-bridge.py >>/app/data/grok-bridge.log 2>&1 & exec /app/start.sh -addr :8787 -proxy :8788
    restart: unless-stopped

volumes:
  pgdata:
