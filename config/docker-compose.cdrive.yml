# Windows Docker Desktop 的 D: virtiofs 损坏、且引擎能跟着 C: NTFS 联接走时用。
# 先在宿主机建联接（不需要管理员），再写入 .compose.env：
#   mklink /J %USERPROFILE%\artex-bind <ARTEX安装目录>
#   mklink /J %USERPROFILE%\erka-bind <本仓库>
#   ARTEX_BIND=C:/Users/you/artex-bind
#   ERKA_BIND=C:/Users/you/erka-bind
#   GROK_AUTH_JSON=C:/Users/you/.grok/auth.json
#
#   docker compose -p artex --env-file "%ARTEX_HOME%/.env" --env-file config/.compose.env -f config/docker-compose.cdrive.yml up -d
#
# 部分 Docker Desktop 会把联接解析回 D: 真实路径，那份环境请改用 namedvol.yml。
# 不要把本文件复制成 ARTEX/docker-compose.override.yml。
# 不要整卷 overlay /app/skills。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 ARTEX .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: mianhuatang11/artex:${ARTEX_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      GROK_BRIDGE_HOST: "127.0.0.1"
      GROK_BRIDGE_PORT: "8790"
      GROK_AUTH_JSON: /auth.json
      GROK_BRIDGE_LOG: /app/data/grok-bridge.log
      PYTHONUNBUFFERED: "1"
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ${ARTEX_BIND:?set ARTEX_BIND}/data:/app/data
      - ${ARTEX_BIND:?set ARTEX_BIND}/skills:/app/skills
      - ${ARTEX_BIND:?set ARTEX_BIND}/grok-bridge.py:/app/grok-bridge.py:ro
      - ${GROK_AUTH_JSON:?set GROK_AUTH_JSON}:/auth.json:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-pentest:/app/skills/pos-pentest:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-usb-entry:/app/skills/pos-usb-entry:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-pax-fastboot:/app/skills/pos-pax-fastboot:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-verifone-sbi:/app/skills/pos-verifone-sbi:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-mtk-brom:/app/skills/pos-mtk-brom:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-android-lpe:/app/skills/pos-android-lpe:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-takeover:/app/skills/pos-takeover:ro
      - ${ERKA_BIND:?set ERKA_BIND}/skills/pos-code-audit:/app/skills/pos-code-audit:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python -u /app/grok-bridge.py >>/app/data/grok-bridge.log 2>&1 & exec /app/start.sh -addr :8787 -proxy :8788
    restart: unless-stopped

volumes:
  pgdata:
