# 叠在 ARTEX 自带 compose 上，只追加八个 pos-* Skill 挂载。
# 不要把整个 ${ERKA_ROOT}/skills 盖到 /app/skills，否则会盖掉 api-recon / bytesrc。
#
# 先在本仓库生成路径：
#   python scripts/bootstrap-terminal-agent.py --init
# 再叠到你的 ARTEX 目录（把 ARTEX_HOME 换成实际路径）：
#   docker compose --env-file config/.compose.env -f "%ARTEX_HOME%/docker-compose.yml" -f config/docker-compose.terminal.yml up -d
#
# 若已经把 override.example 复制成 ARTEX/docker-compose.override.yml，不要再叠这一份。
# extra_hosts 给 Linux 引擎解析 host.docker.internal；Windows Docker Desktop 自带该名。

services:
  artex:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${ERKA_ROOT}/skills/pos-pentest:/app/skills/pos-pentest:ro
      - ${ERKA_ROOT}/skills/pos-usb-entry:/app/skills/pos-usb-entry:ro
      - ${ERKA_ROOT}/skills/pos-pax-fastboot:/app/skills/pos-pax-fastboot:ro
      - ${ERKA_ROOT}/skills/pos-verifone-sbi:/app/skills/pos-verifone-sbi:ro
      - ${ERKA_ROOT}/skills/pos-mtk-brom:/app/skills/pos-mtk-brom:ro
      - ${ERKA_ROOT}/skills/pos-android-lpe:/app/skills/pos-android-lpe:ro
      - ${ERKA_ROOT}/skills/pos-takeover:/app/skills/pos-takeover:ro
      - ${ERKA_ROOT}/skills/pos-code-audit:/app/skills/pos-code-audit:ro
