# Windows Docker Desktop 的 D: virtiofs 损坏时用。
# 数据/Skill 走 named volume，宿主机文件用 docker cp 灌进去（不经过 virtiofs D:）。
#
#   python scripts/bootstrap-terminal-agent.py --init
#   docker compose -p artex --env-file "%ARTEX_HOME%/.env" --env-file config/.compose.env -f config/docker-compose.namedvol.yml up -d
#   docker cp "%ARTEX_HOME%/grok-bridge.py" artex-artex-1:/app/grok-bridge.py
#   docker cp "%ARTEX_HOME%/skills/." artex-artex-1:/app/skills/
#   docker cp "${ERKA_ROOT}/skills/." artex-artex-1:/app/skills/
#
# 不要叠原 docker-compose.yml（若它含坏掉的 D: 绑定）。
# /app/skills 是 named volume，必须把 api-recon / bytesrc / pos-* 一并 cp 进去。
# 需要 Grok 桥时在 .compose.env 里设 GROK_AUTH_JSON。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 ARTEX .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: mianhuatang11/artex:${ARTEX_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      GROK_BRIDGE_HOST: "127.0.0.1"
      GROK_BRIDGE_PORT: "8790"
      GROK_AUTH_JSON: /auth.json
      GROK_BRIDGE_LOG: /app/data/grok-bridge.log
      PYTHONUNBUFFERED: "1"
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - artex_app_data:/app/data
      - artex_app_skills:/app/skills
      - ${GROK_AUTH_JSON}:/auth.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /app/start.sh -addr :8787 -proxy :8788
    restart: unless-stopped

volumes:
  pgdata:
  artex_app_data:
  artex_app_skills:
