name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: bootstrap --self-check
        run: python scripts/bootstrap-terminal-agent.py --self-check
      - name: MCP smoke
        run: python mcp/pos-delivery/smoke.py
